<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hallan Cash &amp; Carry – Account Opening Form</title>
<style>
:root {
  --gold:#c8a84b; --gold-dk:#a8873a; --black:#152d4d; --ink:#222; --muted:#666;
  --border:#d8d8d8; --bg:#f0f0f0; --surface:#fff; --red:#c00; --r:5px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
.hdr{background:#152d4d;text-align:center;padding:20px 16px;border-bottom:4px solid var(--gold)}
.hdr h2{color:var(--gold);font-size:1.1rem}
.wrap{max-width:820px;margin:30px auto 70px;padding:0 14px}
.intro{background:var(--black);color:#fff;border-radius:var(--r);padding:22px 24px;margin-bottom:26px}
.intro h1{font-size:1.35rem;color:var(--gold);margin-bottom:4px}
.intro p{font-size:.88rem;color:#ccc;margin-top:6px}
.intro .req-note{margin-top:10px;font-size:.82rem;color:#aaa}
.intro .req-note span{color:var(--gold);font-weight:700}
#statusBanner{display:none;border-radius:var(--r);padding:16px 20px;margin-bottom:24px;font-weight:600;text-align:center;font-size:.95rem}
#statusBanner.ok{background:#d4edda;color:#155724;border:1px solid #b8dfc7}
#statusBanner.err{background:#fde8e8;color:#7b1a1a;border:1px solid #f3bebe}
#loadingMsg{text-align:center;padding:40px;color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:0 1px 5px rgba(0,0,0,.09);margin-bottom:22px;overflow:hidden}
.card-hd{background:var(--black);color:var(--gold);padding:11px 20px;font-size:.82rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.card-bd{padding:22px 22px 18px;display:flex;flex-direction:column;gap:16px}
.f{display:flex;flex-direction:column;gap:5px}
label.lbl{font-size:.80rem;font-weight:700;color:#444;display:flex;gap:3px;align-items:baseline;flex-wrap:wrap}
label.lbl .ast{color:var(--red)}
input[type=text],input[type=email],input[type=tel],input[type=date],select,textarea{
  width:100%;border:1px solid var(--border);border-radius:var(--r);padding:9px 12px;font-size:.88rem;
  font-family:inherit;color:var(--ink);background:#fafafa;transition:border-color .18s,box-shadow .18s
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,168,75,.15);background:#fff}
input.err,select.err,textarea.err{border-color:var(--red)}
textarea{resize:vertical;min-height:70px}
.ck-group,.radio-group{display:flex;flex-wrap:wrap;gap:10px 20px;margin-top:4px}
.ck-item,.radio-item{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:.88rem}
.ck-item input,.radio-item input{width:16px;height:16px;accent-color:var(--gold);cursor:pointer;flex-shrink:0}
.file-zone{border:2px dashed var(--border);border-radius:var(--r);padding:18px 16px;text-align:center;cursor:pointer;background:#fafafa;position:relative}
.file-zone.has-file{border-color:#4caf50;border-style:solid;background:#f5fdf5}
.file-zone input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.fprev{margin-top:6px;font-size:.82rem}
.fprev .up{color:var(--gold-dk)}.fprev .ok{color:#2e7d32}.fprev .fail{color:var(--red)}
.submit-row{text-align:center;padding-top:6px}
.btn-submit{background:var(--gold);color:var(--black);border:none;border-radius:var(--r);padding:14px 56px;font-size:.95rem;font-weight:700;cursor:pointer;letter-spacing:.05em;text-transform:uppercase;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.btn-submit:disabled{background:#ccc;cursor:not-allowed}
.spinner{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(0,0,0,.2);border-top-color:var(--black);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:7px}
@keyframes spin{to{transform:rotate(360deg)}}
.agree-block{border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;background:#fffdf5}
</style>
</head>
<body>
<div class="hdr"><h2>Hallan Cash &amp; Carry</h2></div>
<div class="wrap">
  <div id="statusBanner"></div>
  <div class="intro">
    <h1>Account Opening Form</h1>
    <p><em>Thank you for choosing us!!</em></p>
    <p class="req-note"><span>*</span> Indicates required question</p>
  </div>
  <div id="loadingMsg">Loading form…</div>
  <form id="mainForm" novalidate style="display:none"></form>
</div>

<script>
// ─────────────────────────────────────────────
var APPS_SCRIPT_URL = 'PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE';
// ─────────────────────────────────────────────

var CONFIG = [];
var fileUrls = {};   // fieldId -> uploaded url
var uploading = {};  // fieldId -> bool

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function loadForm() {
  fetch(APPS_SCRIPT_URL + '?action=getConfig')
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (!res.success) { document.getElementById('loadingMsg').textContent = 'Could not load form: ' + res.message; return; }
      CONFIG = res.fields;
      renderForm();
    })
    .catch(function(err){ document.getElementById('loadingMsg').textContent = 'Error loading form: ' + err.message; });
}

function renderForm() {
  var sections = {};
  var order = [];
  CONFIG.forEach(function(f){
    if (!sections[f.section]) { sections[f.section] = []; order.push(f.section); }
    sections[f.section].push(f);
  });

  var html = '';
  order.forEach(function(secName){
    html += '<div class="card"><div class="card-hd">' + esc(secName) + '</div><div class="card-bd">';
    sections[secName].forEach(function(f){ html += renderField(f); });
    html += '</div></div>';
  });
  html += '<div class="submit-row"><button type="submit" id="submitBtn" class="btn-submit">Submit Application</button></div>';

  var form = document.getElementById('mainForm');
  form.innerHTML = html;
  form.style.display = '';
  document.getElementById('loadingMsg').style.display = 'none';
  form.addEventListener('submit', onSubmit);

  // wire up file inputs
  CONFIG.filter(function(f){ return f.type === 'file'; }).forEach(function(f){
    document.getElementById('file_' + f.id).addEventListener('change', function(){ handleFile(f.id, this); });
  });
  // "Other" text linking for checkbox groups with allowOther
  CONFIG.filter(function(f){ return f.type === 'checkbox-group' && f.allowOther; }).forEach(function(f){
    var otherText = document.getElementById(f.id + '_otherText');
    var otherChk = document.getElementById(f.id + '_otherChk');
    if (otherText && otherChk) {
      otherText.addEventListener('input', function(){ otherChk.checked = this.value.trim().length > 0; });
    }
  });
}

function renderField(f) {
  var req = f.required ? ' <span class="ast">*</span>' : '';
  var lbl = '<label class="lbl">' + esc(f.label) + req + '</label>';
  switch (f.type) {
    case 'text': case 'email': case 'tel': case 'date':
      return '<div class="f"><label class="lbl" for="fld_'+f.id+'">' + esc(f.label) + req + '</label>' +
             '<input type="'+f.type+'" id="fld_'+f.id+'" data-field="'+f.id+'"></div>';
    case 'textarea':
      return '<div class="f"><label class="lbl" for="fld_'+f.id+'">' + esc(f.label) + req + '</label>' +
             '<textarea id="fld_'+f.id+'" data-field="'+f.id+'" rows="3"></textarea></div>';
    case 'dropdown':
      var opts = '<option value="">-- Select --</option>' + f.options.map(function(o){ return '<option value="'+esc(o)+'">'+esc(o)+'</option>'; }).join('');
      return '<div class="f"><label class="lbl" for="fld_'+f.id+'">' + esc(f.label) + req + '</label>' +
             '<select id="fld_'+f.id+'" data-field="'+f.id+'">'+opts+'</select></div>';
    case 'checkbox-group':
      var items = f.options.map(function(o){
        return '<label class="ck-item"><input type="checkbox" name="grp_'+f.id+'" value="'+esc(o)+'"> '+esc(o)+'</label>';
      }).join('');
      if (f.allowOther) {
        items += '<label class="ck-item">'+
                 '<input type="checkbox" id="'+f.id+'_otherChk" name="grp_'+f.id+'" value="Other"> Other:&nbsp;'+
                 '<input type="text" id="'+f.id+'_otherText" style="max-width:180px;margin-left:6px">'+
                 '</label>';
      }
      return '<div class="f"><label class="lbl">' + esc(f.label) + req + '</label><div class="ck-group" id="grp_'+f.id+'">'+items+'</div></div>';
    case 'radio-group':
      var ritems = f.options.map(function(o){
        return '<label class="radio-item"><input type="radio" name="grp_'+f.id+'" value="'+esc(o)+'"> '+esc(o)+'</label>';
      }).join('');
      return '<div class="f"><label class="lbl">' + esc(f.label) + req + '</label><div class="radio-group" id="grp_'+f.id+'">'+ritems+'</div></div>';
    case 'agree':
      return '<div class="agree-block"><label class="lbl" style="margin-bottom:8px">' + esc(f.label) + req + '</label>' +
             '<div class="radio-group" id="grp_'+f.id+'"><label class="radio-item"><input type="radio" name="grp_'+f.id+'" value="Agree"> Agree</label></div></div>';
    case 'file':
      return '<div class="f"><label class="lbl">' + esc(f.label) + req + '</label>' +
             '<div class="file-zone" id="zone_'+f.id+'">'+
             '<input type="file" id="file_'+f.id+'" accept=".pdf,.jpg,.jpeg,.png">'+
             '<div>📎 Click to upload file (PDF, JPG, PNG — max 10MB)</div></div>'+
             '<div class="fprev" id="fprev_'+f.id+'"></div></div>';
    default:
      return '';
  }
}

function handleFile(fieldId, input) {
  var file = input.files[0];
  if (!file) return;
  if (file.size > 10*1024*1024) { showPrev(fieldId,'fail','File too large (max 10MB)'); input.value=''; return; }
  showPrev(fieldId,'up','⏳ Uploading ' + file.name + '…');
  uploading[fieldId] = true;
  var reader = new FileReader();
  reader.onload = function(e){
    var b64 = e.target.result.split(',')[1];
    fetch(APPS_SCRIPT_URL, { method:'POST', body: JSON.stringify({ action:'upload', base64Data:b64, fileName:file.name, mimeType:file.type }) })
      .then(function(r){ return r.json(); })
      .then(function(res){
        uploading[fieldId] = false;
        if (res.success) {
          fileUrls[fieldId] = res.url;
          showPrev(fieldId,'ok','✓ ' + res.name + ' uploaded');
          document.getElementById('zone_'+fieldId).classList.add('has-file');
        } else { showPrev(fieldId,'fail','✗ Upload failed: ' + (res.error||res.message)); }
      })
      .catch(function(err){ uploading[fieldId]=false; showPrev(fieldId,'fail','✗ Upload error: ' + err.message); });
  };
  reader.readAsDataURL(file);
}
function showPrev(fieldId, cls, msg){ document.getElementById('fprev_'+fieldId).innerHTML = '<span class="'+cls+'">'+msg+'</span>'; }

function collectValue(f) {
  if (f.type === 'checkbox-group') {
    var vals = Array.from(document.querySelectorAll('input[name="grp_'+f.id+'"]:checked')).map(function(c){ return c.value; });
    if (f.allowOther) {
      var ot = document.getElementById(f.id+'_otherText');
      if (ot && ot.value.trim()) { vals = vals.map(function(v){ return v==='Other' ? 'Other: '+ot.value.trim() : v; }); }
    }
    return vals.join(', ');
  }
  if (f.type === 'radio-group' || f.type === 'agree') {
    var el = document.querySelector('input[name="grp_'+f.id+'"]:checked');
    return el ? el.value : '';
  }
  if (f.type === 'file') return fileUrls[f.id] || '';
  var input = document.getElementById('fld_' + f.id);
  return input ? input.value.trim() : '';
}

function validate() {
  var ok = true, first = null;
  CONFIG.forEach(function(f){
    if (!f.required) return;
    var val = collectValue(f);
    var bad = !val;
    if (f.type === 'email') bad = bad || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
    if (f.type === 'checkbox-group' || f.type === 'radio-group' || f.type === 'agree') {
      var grp = document.getElementById('grp_' + f.id);
      if (grp) grp.style.outline = bad ? '2px solid var(--red)' : '';
    } else if (f.type === 'file') {
      var zone = document.getElementById('zone_' + f.id);
      if (zone) zone.style.borderColor = bad ? 'var(--red)' : '';
    } else {
      var input = document.getElementById('fld_' + f.id);
      if (input) input.classList.toggle('err', bad);
    }
    if (bad) { ok = false; if (!first) first = f.id; }
  });
  if (first) {
    var el = document.getElementById('fld_'+first) || document.getElementById('grp_'+first) || document.getElementById('zone_'+first);
    if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
  }
  return ok;
}

function onSubmit(e) {
  e.preventDefault();
  if (Object.values(uploading).some(function(v){ return v; })) { showBanner('err','Please wait for file uploads to complete.'); return; }
  if (!validate()) { showBanner('err','Please complete all required fields highlighted in red.'); return; }

  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Submitting…';

  var data = {};
  CONFIG.forEach(function(f){ data[f.id] = collectValue(f); });

  fetch(APPS_SCRIPT_URL, { method:'POST', body: JSON.stringify({ action:'submit', data:data }) })
    .then(function(r){ return r.json(); })
    .then(function(res){
      btn.disabled = false; btn.innerHTML = 'Submit Application';
      if (res.success) {
        showBanner('ok','✓ Your application has been submitted successfully. We will be in touch shortly.');
        document.getElementById('mainForm').reset();
        fileUrls = {}; uploading = {};
        document.querySelectorAll('.fprev').forEach(function(p){ p.innerHTML=''; });
        document.querySelectorAll('.file-zone').forEach(function(z){ z.classList.remove('has-file'); });
        window.scrollTo({top:0, behavior:'smooth'});
      } else {
        showBanner('err','✗ Submission error: ' + res.message);
      }
    })
    .catch(function(err){ btn.disabled=false; btn.innerHTML='Submit Application'; showBanner('err','✗ Technical error: ' + err.message); });
}

function showBanner(type, msg) {
  var b = document.getElementById('statusBanner');
  b.className = type; b.innerHTML = msg; b.style.display = 'block';
  b.scrollIntoView({behavior:'smooth', block:'center'});
}

loadForm();
</script>
</body>
</html>
